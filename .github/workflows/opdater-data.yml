name: Opdater data

on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Start nyt build på Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "Mangler secret RENDER_DEPLOY_HOOK"
            exit 1
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Render-deploy startet"
